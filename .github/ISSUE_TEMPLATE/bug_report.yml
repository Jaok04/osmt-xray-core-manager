name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Please remove passwords, tokens, private keys, public IPs and other sensitive information before submitting."
  - type: input
    id: version
    attributes:
      label: Tool version or commit
      placeholder: "0.2.0-dev / commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      placeholder: "Ubuntu 24.04 LTS, amd64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands or menu steps, with sensitive values removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, credentials, hostnames and identifying information.
    validations:
      required: false
